apiVersion: batch/v1
kind: Job
metadata:
  name: budgetroute-migrate
  namespace: budgetroute
  labels:
    app.kubernetes.io/name: budgetroute
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: budgetroute
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate-store
          image: ghcr.io/bearax/budgetroute-llm:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "budgetroute", "migrate-store", "--config", "configs/serving/postgres.yaml"]
          env:
            - name: BUDGETROUTE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: budgetroute-secrets
                  key: postgres-migration-dsn
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
