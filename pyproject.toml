[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "budgetroute-llm"
version = "0.6.0"
description = "Quality-aware, tenant-aware routing for reproducible language-model inference"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Aleksandr Medvedev" }]
keywords = ["llm", "routing", "inference", "retrieval", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<2.4",
  "psutil>=5.9",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.30"]
transformers = ["torch>=2.3", "tokenizers>=0.19", "transformers>=4.43"]
retrieval = ["faiss-cpu>=1.8; platform_system != 'Windows'"]
datasets = ["datasets>=3.0,<5"]
learned = ["joblib>=1.4", "scikit-learn>=1.5"]
reporting = ["jinja2>=3.1", "matplotlib>=3.9", "pandas>=2.2"]
gpu = [
  "accelerate>=0.33",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
  "torch>=2.3",
  "tokenizers>=0.19",
  "transformers>=4.43",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "fastapi>=0.115",
  "httpx>=0.27",
  "joblib>=1.4",
  "jinja2>=3.1",
  "matplotlib>=3.9",
  "mypy>=1.11",
  "pandas>=2.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "scikit-learn>=1.5",
  "types-PyYAML>=6.0",
  "types-psutil>=5.9",
  "uvicorn>=0.30",
]
all = [
  "accelerate>=0.33",
  "datasets>=3.0,<5",
  "faiss-cpu>=1.8; platform_system != 'Windows'",
  "fastapi>=0.115",
  "httpx>=0.27",
  "joblib>=1.4",
  "jinja2>=3.1",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "torch>=2.3",
  "tokenizers>=0.19",
  "transformers>=4.43",
  "uvicorn>=0.30",
]

[project.scripts]
budgetroute = "budgetroute.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/budgetroute"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/configs", "/data", "/docs", "/scripts", "/*.md", "/*.toml", "/LICENSE"]
exclude = ["/AGENTS.md", "/PLANS.md", "/docs/exec-plans"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# Typer's supported declarative interface intentionally uses Option() defaults.
"src/budgetroute/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["budgetroute"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "datasets.*",
  "faiss.*",
  "joblib.*",
  "matplotlib.*",
  "pandas.*",
  "sklearn.*",
  "torch.*",
  "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests using offline fake components",
  "performance: deterministic timing and batching tests",
  "real_model: optional tests that may download a model",
]

[tool.coverage.run]
branch = true
source = ["budgetroute"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
