services:
  budgetroute:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback-only publication: place an HTTPS reverse proxy in front before remote use.
      - "127.0.0.1:8000:8000"
    environment:
      BUDGETROUTE_HOST: 0.0.0.0
      BUDGETROUTE_PORT: "8000"
      BUDGETROUTE_OUTPUT_DIR: /app/outputs
      BUDGETROUTE_API_KEY: "${BUDGETROUTE_API_KEY:?Set BUDGETROUTE_API_KEY before starting}"
    volumes:
      - ./outputs:/app/outputs
      - ./model-cache:/home/budgetroute/.cache/huggingface
      - budgetroute-state:/app/data/state
    restart: unless-stopped

volumes:
  budgetroute-state:
