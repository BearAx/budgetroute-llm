name: budgetroute
mode: fake
seed: 42
output_dir: outputs
batching:
  enabled: false
  max_batch_size: 8
  max_wait_ms: 10
api:
  host: 127.0.0.1
  port: 8000
  log_level: info
  max_prompt_chars: 50000
retrieval:
  enabled: false
  corpus_path: data/sample_corpus
  index_path: data/indexes/sample-index.npz
  embedder: fake
  index_type: exact
  embedding_dimension: 128
  chunk_size: 500
  chunk_overlap: 50
  top_k: 3
  min_similarity: 0.12
routing:
  policy: heuristic
  seed: 42
  difficulty_threshold: 0.35
  abstain_threshold: 0.2
  cascade_confidence_threshold: 0.65
  retrieval_similarity_threshold: 0.12
benchmark:
  dataset_path: data/sample_benchmark.jsonl
  policies: [always_small, always_large, heuristic, retrieval_first, cascade]
  warmup_runs: 1
  measured_runs: 1
  concurrency: 1
  batch_size: 1
  quality_threshold: 0.8
  fake: true
