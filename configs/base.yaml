name: budgetroute
mode: fake
seed: 42
output_dir: outputs
batching:
  enabled: false
  max_batch_size: 8
  max_wait_ms: 10
  max_queue_size: 256
  submit_timeout_ms: 100
  request_timeout_ms: 120000
api:
  host: 127.0.0.1
  port: 8000
  log_level: info
  max_prompt_chars: 50000
  max_request_bytes: 1048576
  require_api_key: false
  api_key_env: BUDGETROUTE_API_KEY
  rate_limit_requests: 60
  rate_limit_window_seconds: 60
  trusted_hosts: [localhost, 127.0.0.1, testserver]
  metrics_enabled: true
  feedback_enabled: false
  review_enabled: false
  external_tls_termination: false
operations:
  backend: memory
  database_path: data/state/budgetroute.db
  postgres_dsn_env: BUDGETROUTE_POSTGRES_DSN
  postgres_pool_min_size: 1
  postgres_pool_max_size: 16
  postgres_connect_timeout_seconds: 10
  postgres_require_tls: true
  postgres_auto_migrate: true
  replica_id_env: BUDGETROUTE_REPLICA_ID
  max_global_inflight: 64
  lease_ttl_seconds: 180
  quota_requests: 1000
  quota_window_seconds: 60
  audit_retention_events: 100000
adaptation:
  enabled: false
  registry_path: data/state/calibration-registry
  minimum_labeled_samples: 100
  holdout_fraction: 0.25
  minimum_brier_improvement: 0.002
  maximum_ece_regression: 0.01
  target_selective_accuracy: 0.8
  change_point_threshold: 5.0
  change_point_delta: 0.005
content_policy:
  enabled: false
  prompt_blocklist: []
  output_blocklist: []
  max_metadata_json_chars: 20000
  max_metadata_depth: 6
  max_metadata_keys: 100
monitoring:
  enabled: true
  window_size: 500
  minimum_samples: 50
  drift_threshold: 0.2
retrieval:
  enabled: false
  corpus_path: data/sample_corpus
  index_path: data/indexes/sample-index.npz
  embedder: fake
  index_type: exact
  embedding_dimension: 128
  chunk_size: 500
  chunk_overlap: 50
  top_k: 3
  min_similarity: 0.12
routing:
  policy: heuristic
  seed: 42
  difficulty_threshold: 0.35
  abstain_threshold: 0.2
  cascade_confidence_threshold: 0.65
  retrieval_similarity_threshold: 0.12
  target_latency_ms: 1000
  overload_threshold: 1.0
  quality_weight: 0.6
  latency_weight: 0.25
  cost_weight: 0.15
  human_review_enabled: false
  human_review_threshold: 0.9
benchmark:
  dataset_path: data/sample_benchmark.jsonl
  policies: [always_small, always_large, heuristic, retrieval_first, cascade]
  warmup_runs: 1
  measured_runs: 1
  concurrency: 1
  batch_size: 1
  quality_threshold: 0.8
  cache:
    mode: "off"
    directory: outputs/cache/generations
  replay_verify_samples: 0
  fake: true
  bootstrap_samples: 1000
  minimum_samples_for_claims: 100
