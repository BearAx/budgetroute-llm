name: Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - src/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel and packaged migrations
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from importlib.resources import files; import budgetroute; migration = files('budgetroute.operations.migrations.postgres').joinpath('0001_initial.sql'); assert budgetroute.__version__ == '0.7.0'; assert migration.is_file(); assert 'CREATE TABLE quota_windows' in migration.read_text(encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
