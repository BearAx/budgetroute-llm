name: Feature request
description: Propose a scoped product, research, or engineering improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or research problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain behavior, architecture, and benchmark-methodology impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How would we test the implementation and avoid unsupported claims?
    validations:
      required: true

