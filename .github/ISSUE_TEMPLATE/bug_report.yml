name: Bug report
description: Report a reproducible defect without including secrets or sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include minimal commands, configuration, and safe logs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste relevant `budgetroute doctor` output after checking it for sensitive paths.
    validations:
      required: true
  - type: checkboxes
    id: integrity
    attributes:
      label: Checks
      options:
        - label: I removed secrets, tokens, private data, and model weights.
          required: true

